    <style>
        /* 基本样式重置 */
        body { margin: 0; overflow: hidden; background-color: #000; font-family: "Noto Sans SC", sans-serif; color: white; }
        /* 画布样式 */
        #particle-canvas { display: block; position: fixed; top: 0; left: 0; z-index: -1; }
        /* 确保导航和文本在最上层 */
        .overlay-content { position: relative; z-index: 1; transition: opacity 0.5s ease-out; }
        /* 容器内导航按钮的自定义样式 */
        .nav-container .nav-button-inner { color: #374151; transition: background-color 0.3s ease, color 0.3s ease; padding: 0.25rem 0.75rem; font-size: 0.875rem; line-height: 1.25rem; border-radius: 0.375rem; white-space: nowrap; cursor: pointer; }
        .nav-container .nav-button-inner:hover { background-color: rgba(0, 0, 0, 0.05); }
        /* 主要导航按钮的自定义样式 */
        .nav-container .nav-button-primary-inner { background-color: #1f2937; color: #ffffff; font-weight: 600; padding: 0.25rem 1rem; font-size: 0.875rem; line-height: 1.25rem; border-radius: 0.375rem; display: flex; align-items: center; gap: 0.25rem; transition: background-color 0.3s ease; white-space: nowrap; cursor: pointer; }
        .nav-container .nav-button-primary-inner:hover { background-color: #374151; }
        /* 底部按钮 */
        #free-trial-button-bottom { cursor: pointer; }
        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
        /* 用于淡入淡出和隐藏的实用工具类 */
        .fade-out { opacity: 0 !important; pointer-events: none !important; }
        .hidden { display: none !important; }
        .fade-in { opacity: 1 !important; pointer-events: auto !important; }
        /* 上传按钮容器样式 */
        #upload-section { transition: opacity 0.5s ease-out; }
        /* 上传按钮 */
        #upload-button { cursor: pointer; }
        /* 视频播放器容器样式 */
        #video-player-container { transition: opacity 0.5s ease-out; }
    </style>
    </head>
<body class="bg-black text-white">

                    </a>
                </div>
            </nav>
             <main id="main-content" class="flex-grow flex flex-col justify-center items-center text-center px-4 -mt-16 transition-opacity duration-500 ease-out fade-in">
                 <h1 class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-medium tracking-tight mb-4 md:mb-6">
                     AI 智能视频翻译
                 </h1>
                 <p class="text-xl md:text-2xl font-semibold">
                     智译视界 ::
                 </p>
                 <a href="#" id="free-trial-button-bottom" class="mt-12 text-base md:text-lg px-6 py-3 rounded-md bg-white text-black font-semibold flex items-center space-x-1.5 hover:bg-gray-200 transition-colors">
                      <span>免费试用</span>
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>

        <div id="upload-section" class="fixed inset-0 hidden justify-center items-center z-10 opacity-0 pointer-events-none">
            <button id="upload-button" class="bg-white text-black font-semibold px-6 py-3 rounded-md flex items-center space-x-1.5 hover:bg-gray-200 transition-colors pointer-events-auto">
                <span>上传视频</span>

        <input type="file" id="file-input" accept="video/*" class="hidden">

        <div id="video-player-container" class="fixed inset-0 hidden justify-center items-center z-20 p-4 sm:p-8 opacity-0 pointer-events-none">
             <div class="bg-black/60 backdrop-blur-lg rounded-2xl p-3 shadow-xl max-w-3xl w-full pointer-events-auto">
                 <video id="video-player" class="w-full h-auto max-h-[70vh] rounded-lg block" controls controlslist="nodownload"></video>
             </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 全局变量 ---
        let scene, camera, renderer;
        let particles, geometry, material;
        let animationFrameId;
        let count = 0;

        const particleCount = 4000;
        const separation = 110;
        let amountX, amountZ, numParticlesActual, gridWidth, gridDepth;

        // --- 状态管理 ---
        let animationState = 'initial';
        let transitionProgress = 0;
        let transitionStartTime;
        const transitionDuration = 1000;
        const resetDuration = 1000;

        // --- 粒子数据 ---
        const targetParticleScale = 1.0;
        let baseGridPositions = null;
        let currentInterpolationStartPos = null;
        let currentInterpolationStartScale = null;
        let targetPositions = null;
        let targetRotation = null;

        // --- DOM 元素 ---
        let btnTop, btnBottom, mainPageContent, navbar, mainContent, canvasElement, uploadSection, uploadButton, fileInput, videoPlayerContainer, videoPlayer;

        // --- 初始化函数 ---
        function init() {
            btnTop = document.getElementById('free-trial-button-top');
            btnBottom = document.getElementById('free-trial-button-bottom');
            mainPageContent = document.getElementById('main-page-content');
            navbar = document.getElementById('navbar');
            mainContent = document.getElementById('main-content');
            canvasElement = document.getElementById('particle-canvas');
            uploadSection = document.getElementById('upload-section');
            uploadButton = document.getElementById('upload-button');
            fileInput = document.getElementById('file-input');
            videoPlayerContainer = document.getElementById('video-player-container');
            videoPlayer = document.getElementById('video-player');

            calculateGridDimensions();
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.y = 700;
            camera.position.z = 1200;
            camera.rotation.x = -0.3;

            createParticles();

            if (!particles) {
                 console.error("粒子创建失败，停止初始化。");
                 return;
            }

            renderer = new THREE.WebGLRenderer({
                canvas: canvasElement, antialias: true, alpha: true
            });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);

            defineTargetRotation();
            addEventListeners();
            startAnimationLoop();
        }

        // --- 计算网格尺寸 ---
        function calculateGridDimensions() {
             const safeParticleCount = Math.max(1, particleCount);
             const aspectRatio = (window.innerWidth > 0 && window.innerHeight > 0) ? (window.innerWidth / window.innerHeight) : 1;
            amountX = Math.floor(Math.sqrt(safeParticleCount * aspectRatio));
            amountX = Math.max(1, amountX);
            amountZ = Math.floor(safeParticleCount / amountX);
            amountZ = Math.max(1, amountZ);

            numParticlesActual = amountX * amountZ;
            gridWidth = amountX * separation;
            gridDepth = amountZ * separation;
            // console.log(`Using ${numParticlesActual} particles (${amountX}x${amountZ})`);
        }

        // --- 创建粒子 ---
        function createParticles() {
             if (numParticlesActual <= 0) {
                particles = null; return;
            }
            const positions = new Float32Array(numParticlesActual * 3);
            const scales = new Float32Array(numParticlesActual);
            let i = 0, j = 0;
            for (let ix = 0; ix < amountX; ix++) {
                for (let iz = 0; iz < amountZ; iz++) {
                    if (j + 2 >= positions.length || i >= scales.length) break;
                    positions[j] = ix * separation - (gridWidth / 2);
                    positions[j + 1] = 0;
                    positions[j + 2] = iz * separation - (gridDepth / 2);
                    scales[i] = 1;
                    i++; j += 3;
                }
                 if (j + 2 >= positions.length || i >= scales.length) break;
            }
            baseGridPositions = new Float32Array(positions);

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));
            geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
            geometry.attributes.scale.setUsage(THREE.DynamicDrawUsage);

            const texture = createCircleTextureSoft();
            material = new THREE.PointsMaterial({
                size: 15, map: texture, sizeAttenuation: true, vertexColors: false,
                blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8, depthWrite: false
            });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

         // --- 创建柔和圆形纹理函数 ---
         function createCircleTextureSoft() {
             const canvas = document.createElement('canvas');
             canvas.width = 64; canvas.height = 64;
             const context = canvas.getContext('2d');
             const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
             gradient.addColorStop(0, 'rgba(255,255,255,1)');
             gradient.addColorStop(0.6, 'rgba(255,255,255,0.9)');
             gradient.addColorStop(1, 'rgba(255,255,255,0)');
             context.fillStyle = gradient; context.fillRect(0, 0, 64, 64);
             const texture = new THREE.CanvasTexture(canvas);
             texture.needsUpdate = true; return texture;
        }

        // --- 定义目标旋转 ---
        function defineTargetRotation() {
            targetRotation = new THREE.Quaternion();
            const rotationAxisX = new THREE.Vector3(1, 0, 0);
            const targetTiltAngle = -25 * Math.PI / 180; // -25 度
            targetRotation.setFromAxisAngle(rotationAxisX, targetTiltAngle);
        }

        // --- 添加事件监听器 ---
        function addEventListeners() {
            window.addEventListener('resize', onWindowResize, false);
            btnTop.addEventListener('click', startTransitionForward);
            btnBottom.addEventListener('click', startTransitionForward);
            window.addEventListener('click', handleBackgroundClick, false); // 冒泡阶段

            uploadButton.addEventListener('click', (event) => {
                console.log('Upload button clicked.'); // 保留日志确认按钮事件触发
                event.stopPropagation(); // *** 确保阻止冒泡 ***
                fileInput.click();
            });

            fileInput.addEventListener('change', () => {
                // console.log("File input changed!");
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    // console.log('File selected:', file.name, 'Type:', file.type);

                    if (file.type.startsWith('video/')) {
                        // console.log("File is a video, processing...");
                        if (videoPlayer.src) {
                            // console.log("Revoking previous video URL:", videoPlayer.src);
                            URL.revokeObjectURL(videoPlayer.src);
                        }
                        const videoURL = URL.createObjectURL(file);
                        // console.log("Created Object URL:", videoURL);
                        videoPlayer.src = videoURL;
                        videoPlayer.onloadedmetadata = () => { /* console.log("Video metadata loaded"); */ };
                         videoPlayer.onerror = (e) => {
                            console.error("视频加载错误:", e);
                            alert("无法加载视频文件。");
                            URL.revokeObjectURL(videoURL); videoPlayer.src = '';
                            hideVideoPlayer(); showUploadButton();
                         };
                        showVideoPlayer();
                        hideUploadButton();
                    } else {
                        // console.warn('Selected file is not a video.');
                        alert("请选择一个有效的视频文件。");
                    }
                    fileInput.value = '';
                } else {
                     // console.log("No file selected.");
                }
            });
        }

        // --- 窗口大小调整处理函数 ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Helper: 显示上传按钮 ---
        function showUploadButton() {
             // console.log("Attempting to show upload button...");
             uploadSection.classList.remove('hidden');
             uploadSection.classList.add('flex');
             setTimeout(() => {
                 // console.log("Setting upload button opacity to 1. Current state:", animationState);
                 if (animationState !== 'targetReached') {
                     // console.log("...but state changed, aborting opacity change.");
                     if (!isResetting && animationState === 'initial') {
                        hideUploadButton();
                     }
                     return;
                 };
                 uploadSection.classList.remove('opacity-0');
                 uploadSection.classList.add('opacity-100');
             }, 10);
        }
         // --- Helper: 隐藏上传按钮 ---
        function hideUploadButton() {
            // console.log("Attempting to hide upload button...");
            uploadSection.classList.remove('opacity-100');
            uploadSection.classList.add('opacity-0');
            setTimeout(() => {
                // console.log("Hiding upload button completely (display: none).");
                uploadSection.classList.remove('flex');
                uploadSection.classList.add('hidden');
            }, 500);
        }
         // --- Helper: 显示视频播放器 ---
        function showVideoPlayer() {
            // console.log("Attempting to show video player...");
            videoPlayerContainer.classList.remove('hidden');
            videoPlayerContainer.classList.add('flex');
            setTimeout(() => {
                // console.log("Setting video player opacity to 1. Current state:", animationState);
                videoPlayerContainer.classList.remove('opacity-0');
                videoPlayerContainer.classList.add('opacity-100');
            }, 10);
        }
        // --- Helper: 隐藏视频播放器 ---
        function hideVideoPlayer() {
             // console.log("Attempting to hide video player...");
             videoPlayerContainer.classList.remove('opacity-100');
             videoPlayerContainer.classList.add('opacity-0');
             setTimeout(() => {
                 // console.log("Hiding video player completely (display: none) and resetting src.");
                 videoPlayerContainer.classList.remove('flex');
                 videoPlayerContainer.classList.add('hidden');
                 if (videoPlayer.src) {
                     videoPlayer.pause();
                     // console.log("Revoking video URL:", videoPlayer.src);
                     URL.revokeObjectURL(videoPlayer.src);
                     videoPlayer.src = '';
                     videoPlayer.removeAttribute('src');
                 }
             }, 500);
        }


        // --- 开始正向过渡动画函数 ---
        function startTransitionForward(event) {
            event.preventDefault();
            event.stopPropagation(); // *** 确保阻止冒泡 ***
            if (animationState !== 'initial') return;

            animationState = 'transitioningForward';
            transitionStartTime = Date.now();
            transitionProgress = 0;

            navbar.classList.remove('fade-in');
            mainContent.classList.remove('fade-in');
            navbar.classList.add('fade-out');
            mainContent.classList.add('fade-out');

            hideUploadButton();
            hideVideoPlayer();

            if (!targetPositions) {
                if (!baseGridPositions || numParticlesActual <= 0) return;
                targetPositions = new Float32Array(numParticlesActual * 3);
                const targetVector = new THREE.Vector3();
                let currentIdx = 0;
                for (let ix = 0; ix < amountX; ix++) {
                    for (let iz = 0; iz < amountZ; iz++) {
                        const i3 = currentIdx * 3;
                        if (i3 + 2 >= baseGridPositions.length || i3 + 2 >= targetPositions.length) break;
                        targetVector.set(baseGridPositions[i3], baseGridPositions[i3 + 1], baseGridPositions[i3 + 2]);
                        targetVector.applyQuaternion(targetRotation);
                        targetPositions[i3] = targetVector.x;
                        targetPositions[i3 + 1] = targetVector.y;
                        targetPositions[i3 + 2] = targetVector.z;
                        currentIdx++;
                    }
                     if (currentIdx >= numParticlesActual) break;
                }
            }
            if (!geometry || !geometry.attributes.position || !geometry.attributes.scale) return;
            currentInterpolationStartPos = new Float32Array(geometry.attributes.position.array);
            currentInterpolationStartScale = new Float32Array(geometry.attributes.scale.array);
        }

        // --- 开始反向过渡 (重置) 函数 ---
        function startResetTransition() {
            if (animationState !== 'targetReached') return;

            animationState = 'transitioningReset';
            transitionStartTime = Date.now();
            transitionProgress = 0;

            hideUploadButton();
            hideVideoPlayer();

            if (!geometry || !geometry.attributes.position || !geometry.attributes.scale) return;
            currentInterpolationStartPos = new Float32Array(geometry.attributes.position.array);
            currentInterpolationStartScale = new Float32Array(geometry.attributes.scale.array);

            navbar.classList.remove('fade-out');
            mainContent.classList.remove('fade-out');
            navbar.classList.add('fade-in');
            mainContent.classList.add('fade-in');
        }

        // --- 处理 Window 点击事件函数 (冒泡阶段) ---
        // *** 修改：使用更明确的目标检查 ***
        function handleBackgroundClick(event) {
            // console.log('Window click handler triggered. Target:', event.target);

            // 1. 检查状态：只在目标静态状态下响应
            if (animationState !== 'targetReached') {
                // console.log('Reset condition NOT met (State). State:', animationState);
                return;
            }

            // 2. 显式检查是否点击了我们关心的交互元素或其内部
            if (event.target === uploadButton || uploadButton.contains(event.target) ||
                event.target === btnTop || btnTop.contains(event.target) ||
                event.target === btnBottom || btnBottom.contains(event.target) ||
                event.target.closest('.nav-container a') || // 导航链接
                event.target.closest('#video-player-container') // 视频播放器区域
                ) {
                // console.log('Click on interactive element ignored by background handler.');
                return; // 点击发生在已知交互区域，忽略
            }

            // 3. 如果状态正确，且点击的不是已知交互元素，则认为是背景点击，执行重置
            // console.log('Background click detected. Reset condition met, starting reset.');
            startResetTransition();
        }


        // --- 动画循环控制 ---
        function startAnimationLoop() {
            if (!animationFrameId) {
                animate();
            }
        }
        function stopAnimationLoop() {
             if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
             }
        }

        // --- 动画循环函数 ---
        function animate() {
            animationFrameId = requestAnimationFrame(animate);
            render();
        }

        // --- 渲染函数 ---
        function render() {
             if (!geometry || !geometry.attributes.position || !geometry.attributes.scale) {
                return;
            }

            const positions = geometry.attributes.position.array;
            const scales = geometry.attributes.scale.array;
            let needsUpdate = false;

            switch (animationState) {
                case 'transitioningForward': {
                    const elapsed = Date.now() - transitionStartTime;
                    transitionProgress = Math.min(elapsed / transitionDuration, 1.0);
                    const easedProgress = 1 - Math.pow(1 - transitionProgress, 3);

                    if (!currentInterpolationStartPos || !targetPositions) break;

                    for (let i = 0; i < numParticlesActual; i++) {
                        const i3 = i * 3;
                        if (i3 + 2 >= positions.length || i3 + 2 >= currentInterpolationStartPos.length || i3 + 2 >= targetPositions.length || i >= scales.length || i >= currentInterpolationStartScale.length) continue;
                        positions[i3] = THREE.MathUtils.lerp(currentInterpolationStartPos[i3], targetPositions[i3], easedProgress);
                        positions[i3 + 1] = THREE.MathUtils.lerp(currentInterpolationStartPos[i3 + 1], targetPositions[i3 + 1], easedProgress);
                        positions[i3 + 2] = THREE.MathUtils.lerp(currentInterpolationStartPos[i3 + 2], targetPositions[i3 + 2], easedProgress);
                        scales[i] = THREE.MathUtils.lerp(currentInterpolationStartScale[i], targetParticleScale, easedProgress);
                    }
                    needsUpdate = true;

                    if (transitionProgress >= 1.0) {
                        animationState = 'targetReached';
                        if(targetPositions) geometry.attributes.position.copyArray(targetPositions);
                        for(let i=0; i<numParticlesActual; i++) if(i < scales.length) scales[i] = targetParticleScale;
                        needsUpdate = true;
                        showUploadButton();
                    }
                    break;
                }
                case 'transitioningReset': {
                    const elapsed = Date.now() - transitionStartTime;
                    transitionProgress = Math.min(elapsed / resetDuration, 1.0);
                    const easedProgress = 1 - Math.pow(1 - transitionProgress, 3);

                    if (!currentInterpolationStartPos || !baseGridPositions) break;

                    for (let i = 0; i < numParticlesActual; i++) {
                        const i3 = i * 3;
                         if (i3 + 2 >= positions.length || i3 + 2 >= currentInterpolationStartPos.length || i3 + 2 >= baseGridPositions.length || i >= scales.length || i >= currentInterpolationStartScale.length) continue;
                        positions[i3] = THREE.MathUtils.lerp(currentInterpolationStartPos[i3], baseGridPositions[i3], easedProgress);
                        positions[i3 + 1] = THREE.MathUtils.lerp(currentInterpolationStartPos[i3 + 1], baseGridPositions[i3 + 1], easedProgress);
                        positions[i3 + 2] = THREE.MathUtils.lerp(currentInterpolationStartPos[i3 + 2], baseGridPositions[i3 + 2], easedProgress);
                        scales[i] = THREE.MathUtils.lerp(currentInterpolationStartScale[i], 1.0, easedProgress);
                    }
                    needsUpdate = true;

                    if (transitionProgress >= 1.0) {
                        animationState = 'initial';
                        if(baseGridPositions) geometry.attributes.position.copyArray(baseGridPositions);
                        for(let i=0; i<numParticlesActual; i++) if(i < scales.length) scales[i] = 1.0;
                        needsUpdate = true;
                    }
                    break;
                }
                case 'initial': {
                    count += 0.05;
                    let i = 0, j = 0;
                    if (!baseGridPositions) break;

                    for (let ix = 0; ix < amountX; ix++) {
                        for (let iz = 0; iz < amountZ; iz++) {
                            if (j + 2 >= positions.length || j + 2 >= baseGridPositions.length || i >= scales.length) continue;
                            positions[j + 1] = baseGridPositions[j+1] +
                                               (Math.sin((ix + count) * 0.3) * 50) +
                                               (Math.sin((iz + count) * 0.5) * 50);
                            positions[j] = baseGridPositions[j];
                            positions[j+2] = baseGridPositions[j+2];
                            const baseScaleFactor = 1.0;
                            const waveScaleFactor = (Math.sin((ix + count) * 0.3 + 1) * 0.2 +
                                                     Math.sin((iz + count) * 0.5 + 1) * 0.2);
                            scales[i] = baseScaleFactor + waveScaleFactor;
                            i++; j += 3;
                        }
                    }
                    needsUpdate = true;
                    break;
                }
                case 'targetReached': {
                    needsUpdate = false;
                    break;
                }
            }

            if (needsUpdate) {
                geometry.attributes.position.needsUpdate = true;
                geometry.attributes.scale.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        // --- 启动应用程序 ---
        init();

    </script>
