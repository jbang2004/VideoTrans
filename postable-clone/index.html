<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postable - 将推文转换为社交媒体帖子</title>
    <link rel="stylesheet" href="style.css">
    <!-- 添加 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 搜索容器独立放置，确保它不受其他元素影响 -->
    <div class="search-container">
        <button class="logo-button">
            <span class="button-text"><i class="far fa-comment-dots"></i> Postable</span>
            <input type="text" class="search-input" placeholder="输入推文链接...">
            <i class="fas fa-search search-icon"></i>
        </button>
    </div>
    
    <div class="content-wrapper">
        <div class="main-content">
            <div class="title-section">
                <!-- 添加一个占位符，保持布局一致性 -->
                <div style="height: 60px;"></div>
                <h1>Convert Tweets<br>into Engaging Social<br>Media Posts, Instantly!</h1>
                <p class="subtitle">Click the Postable button above to get started</p>
            </div>
        </div>
        
        <div class="gradient-banner">
            <h2>Share Your Voice<br>Beyond Just a Tweet</h2>
            <p>Keep your online presence steady and growing by creating customizable<br>images from your tweets, perfect for Instagram, Facebook, and more.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
